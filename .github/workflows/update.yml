name: News aktualisieren und veröffentlichen

on:
  schedule:
    # alle 3 Stunden (UTC). Deutschland: +1 (Winter) bzw. +2 (Sommer)
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten (nur für den KI-Schritt)
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Feeds abrufen
        run: node scripts/fetch.mjs

      - name: KI-Zusammenfassungen (nur mit ANTHROPIC_API_KEY)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          AI_MAX_ITEMS: ${{ vars.AI_MAX_ITEMS }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: node scripts/summarize.mjs

      - name: Datenstand committen
        run: |
          git config user.name "news-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push
          fi

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Seite packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Seite veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
